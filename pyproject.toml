[project]
name = "slack-archive-bot"
version = "2.0.1"
description = "A Slack archive search bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blinker==1.9.0",
    "certifi==2024.7.4",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.3",
    "cryptography==50.0.0",
    "dnspython==2.8.0",
    "flask==3.1.3",
    "gunicorn==23.0.0",
    "huggingface-hub==0.24.7",
    "httpx==0.25.2",
    "idna==3.18",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "numpy==1.26.4",
    "openai==3.3.1",
    "pycparser==2.22",
    "pydub==0.25.1",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.2",
    "requests==2.33.0",
    "sentence-transformers==2.2.2",
    "slack-bolt==1.18.0",
    "trafilatura==2.1.0",
    "torch==2.13.0",
    "urllib3==2.7.0",
    "watchdog==4.0.1",
    "werkzeug==3.1.6",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
