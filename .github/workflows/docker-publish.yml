name: Publish Container Image

on:
  schedule:
    - cron: '45 15 * * *'
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]

env:
  PY_BUILD_VERS: 3.11 # Change on need.
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Verify and install locked dependencies
        run: uv sync --frozen
      - name: Audit runtime dependencies
        run: uv run --with pip-audit pip-audit
      - name: Compile application
        run: git ls-files -z '*.py' | xargs -0 uv run python -m py_compile
      - name: Scan medium/high Python security findings
        run: >-
          git ls-files -z '*.py' ':!tests/**' ':!utilities/**' |
          xargs -0 uv run --with bandit bandit -q -ll --
      - name: Run tests
        run: uv run pytest tests

  build:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PY_BUILD_VERS=${{ env.PY_BUILD_VERS }}
            APP_VERSION=2.2.0
            APP_REVISION=${{ github.sha }}
